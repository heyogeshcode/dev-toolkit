[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-toolkit"
version = "0.1.0"
description = "Useful developer utilities, algorithms, and documentation notes."
readme = "README.md"
authors = [
    {name = "Yogesh ydv", email = "yogeshjaangediayadav@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
